name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag in the Origens v0.1 lineage
        required: true
        default: v0.1.0-alpha.1
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: true
      - name: Validate release tag and package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v0\.1\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must remain in the v0.1.x lineage" >&2
            exit 1
          fi
          package_version="$(sed -n 's/^const Version = "\([^"]*\)"$/\1/p' packages/ai/types.go)"
          if [[ "v$package_version" != "$RELEASE_TAG" ]]; then
            echo "packages/ai Version v$package_version does not match $RELEASE_TAG" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "tag $RELEASE_TAG already exists" >&2
            exit 1
          fi
      - name: Check formatting
        shell: bash
        run: |
          files="$(git ls-files '*.go')"
          diff="$(gofmt -d $files)"
          if [[ -n "$diff" ]]; then
            printf '%s\n' "$diff"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test core
        run: go test -race ./packages/ai
      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          args=("$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
