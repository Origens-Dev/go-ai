name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go 1.24
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          files="$(git ls-files '*.go')"
          diff="$(gofmt -d $files)"
          if [[ -n "$diff" ]]; then
            printf '%s\n' "$diff"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test core
        run: go test -race ./packages/ai
